services:
  - type: web
    name: forex-quant-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://forex-quant-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://forex-quant-backend.onrender.com/ws-forex
  - type: web
    name: forex-quant-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/health
    plan: free # Can be upgraded for higher performance
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: forex-quant-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: forex-quant-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: forex-quant-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: forex-quant-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: forex-quant-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false # Set in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set in Render Dashboard
      - key: TOTP_APP_SECRET
        generateValue: true

databases:
  - name: forex-quant-db
    databaseName: forexquant
    user: admin
    plan: free
`