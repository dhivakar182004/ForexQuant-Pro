services:
  - type: web
    name: forex-quant-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free # Can be upgraded for higher performance
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: forex-quant-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: forex-quant-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: forex-quant-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false # Set in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set in Render Dashboard
      - key: TOTP_APP_SECRET
        generateValue: true

databases:
  - name: forex-quant-db
    databaseName: forexquant
    user: admin
    plan: free
