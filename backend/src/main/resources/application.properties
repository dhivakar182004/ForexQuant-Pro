spring.application.name=backend
server.port=${PORT:8081}

# Database Configuration (Production Ready)
spring.datasource.url=${DB_URL:jdbc:h2:mem:forexquant}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JPA & Hibernate Batching Configuration for Fast Real-Time Processing
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Google OAuth2 Security Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}
spring.security.oauth2.client.registration.google.scope=profile,email

# TOTP Custom Properties
forexquant.totp.secret=${TOTP_APP_SECRET:replace-with-a-very-secure-secret-key}

# External Forex API WebSockets (Finnhub, Polygon)
forexquant.api.websocket.url=wss://ws.finnhub.io?token=YOUR_FINNHUB_KEY

# Jackson Date Formatting Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
