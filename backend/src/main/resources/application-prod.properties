

# Guaranteed Reliable Database for Exam Demo (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:forexquant_prod;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP Robustness (survive DNS propagation lag & database cold starts)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

# Security
forexquant.totp.secret=${TOTP_APP_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}

# Market Data
forexquant.api.websocket.url=${FINNHUB_WS_URL:wss://ws.finnhub.io?token=YOUR_FINNHUB_KEY}

# Jackson Date Formatting Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Speed up startup to prevent Render health check timeout
spring.main.lazy-initialization=true
