

# Production Database (PostgreSQL provided by Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP Robustness (survive DNS propagation lag & database cold starts)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000

# Security
forexquant.totp.secret=${TOTP_APP_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}

# Market Data
forexquant.api.websocket.url=${FINNHUB_WS_URL:wss://ws.finnhub.io?token=YOUR_FINNHUB_KEY}

# Jackson Date Formatting Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
